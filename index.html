<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number Arenaa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070913;
            --surface: rgba(18, 22, 40, 0.75);
            --surface-subtle: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.22);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --gold: #fbbf24;
            --win: #10b981;
            --lose: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 10%, #1e153b 0%, #0c0d1d 55%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Glow & Canvas */
        .ambient-glow {
            position: fixed;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
            opacity: 0.6;
        }

        canvas#confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* Game Card Container */
        .game-card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 28px 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s ease;
        }

        /* Header & Stats */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-badge {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-val.gold {
            color: var(--gold);
        }

        /* Number Selector Strip */
        .section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .num-btn {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            height: 48px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        .num-btn.selected {
            background: var(--accent);
            border-color: #a78bfa;
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
            transform: scale(1.04);
        }

        /* Bet Controls */
        .bet-box {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }

        .bet-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .currency-symbol {
            color: var(--gold);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .bet-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .bet-chips {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .bet-chip {
            flex: 1;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bet-chip:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* Action Button */
        .btn-play {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            border: none;
            border-radius: 18px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -5px rgba(124, 58, 237, 0.65);
        }

        .btn-play:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Visual Reveal Box */
        .slot-display {
            height: 90px;
            margin-top: 20px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .slot-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            color: #fff;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .slot-message {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .text-win { color: var(--win); }
        .text-lose { color: var(--lose); }

        /* History Indicators */
        .history-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }

        .history-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
        }

        .history-dot.win {
            background: var(--win);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .history-dot.lose {
            background: var(--lose);
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
        }

        /* Bonus Modal Card */
        .bonus-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bonus-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .bonus-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .bonus-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .bonus-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-ghost {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .btn-gold {
            background: var(--gold);
            border: none;
            color: #000;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <canvas id="confetti-canvas"></canvas>

    <div class="game-card" id="game-card">
        <div class="header">
            <h1 class="title">Lucky Number</h1>
        </div>

        <div class="stats-bar">
            <div class="stat-badge">
                <span class="stat-label">Balance</span>
                <span class="stat-val gold">₹<span id="balance">100.00</span></span>
            </div>
            <div class="stat-badge">
                <span class="stat-label">Win Streak</span>
                <span class="stat-val">🔥 <span id="streak">0</span></span>
            </div>
        </div>

        <div class="section-label">
            <span>Select Lucky Number</span>
            <span id="selected-preview" style="color: var(--accent); font-weight:700;">#0</span>
        </div>
        <div class="number-grid" id="number-grid">
            <!-- Rendered by JS -->
        </div>

        <div class="bet-box">
            <span class="stat-label">Wager Amount</span>
            <div class="bet-input-row">
                <span class="currency-symbol">₹</span>
                <input type="number" id="bet" class="bet-input" min="1" value="10" step="5">
            </div>
            <div class="bet-chips">
                <button class="bet-chip" onclick="adjustBet(0.5)">½</button>
                <button class="bet-chip" onclick="adjustBet(2)">2×</button>
                <button class="bet-chip" onclick="setQuickBet(25)">+25</button>
                <button class="bet-chip" onclick="setBetMax()">MAX</button>
            </div>
        </div>

        <button class="btn-play" id="play-btn">LOCK & SPIN</button>

        <div class="slot-display" id="slot-display">
            <div class="slot-number" id="slot-number">-</div>
            <div class="slot-message" id="slot-message">Ready to Roll</div>
        </div>

        <div class="history-row" id="history"></div>

        <!-- Bonus Overlay Modal -->
        <div class="bonus-overlay" id="bonus-offer" style="display: none;">
            <div class="bonus-badge">HOT STREAK!</div>
            <div class="bonus-title">Double Or Nothing?</div>
            <div class="bonus-desc">You're on a roll! Double your bet instantly for the next roll?</div>
            <div class="bonus-actions">
                <button class="btn-ghost" id="continue-btn">Keep Current</button>
                <button class="btn-gold" id="double-btn">Double Bet</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let balance = 100.00;
        let streak = 0;
        let selectedNumber = 0;
        let gameHistory = [];

        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const streakEl = document.getElementById('streak');
        const betInput = document.getElementById('bet');
        const playBtn = document.getElementById('play-btn');
        const slotNumber = document.getElementById('slot-number');
        const slotMessage = document.getElementById('slot-message');
        const slotDisplay = document.getElementById('slot-display');
        const historyEl = document.getElementById('history');
        const bonusOffer = document.getElementById('bonus-offer');
        const doubleBtn = document.getElementById('double-btn');
        const continueBtn = document.getElementById('continue-btn');
        const numberGrid = document.getElementById('number-grid');
        const selectedPreview = document.getElementById('selected-preview');
        const gameCard = document.getElementById('game-card');

        // Build Number Selector Grid (0-9)
        function initGrid() {
            numberGrid.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = `num-btn ${i === selectedNumber ? 'selected' : ''}`;
                btn.textContent = i;
                btn.onclick = () => {
                    selectedNumber = i;
                    selectedPreview.textContent = `#${i}`;
                    document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                numberGrid.appendChild(btn);
            }
        }

        // Quick Bet Helpers
        function adjustBet(factor) {
            let current = parseFloat(betInput.value) || 0;
            betInput.value = Math.max(1, Math.floor(current * factor));
        }

        function setQuickBet(val) {
            let current = parseFloat(betInput.value) || 0;
            betInput.value = current + val;
        }

        function setBetMax() {
            betInput.value = Math.floor(balance);
        }

        // Play Game Logic
        playBtn.addEventListener('click', () => {
            const bet = parseFloat(betInput.value);

            if (isNaN(bet) || bet <= 0) {
                shakeElement(betInput);
                return;
            }

            if (bet > balance) {
                shakeElement(gameCard);
                slotMessage.textContent = "Insufficient Balance";
                slotMessage.className = "slot-message text-lose";
                return;
            }

            playBtn.disabled = true;
            slotMessage.textContent = "Rolling...";
            slotMessage.className = "slot-message";

            // Rolling Slot Animation
            let rollInterval;
            let counter = 0;
            rollInterval = setInterval(() => {
                slotNumber.textContent = Math.floor(Math.random() * 10);
                counter++;
                if (counter > 15) {
                    clearInterval(rollInterval);
                    finalizeRound(bet);
                }
            }, 60);
        });

        function finalizeRound(bet) {
            const rolled = Math.floor(Math.random() * 10);
            slotNumber.textContent = rolled;

            const isWin = selectedNumber === rolled;

            if (isWin) {
                const payout = bet * 9; // Authentic 1-in-10 odds payout
                balance += payout;
                streak++;
                slotMessage.textContent = `Won +₹${payout.toFixed(2)}`;
                slotMessage.className = "slot-message text-win";
                slotDisplay.style.borderColor = "var(--win)";
                triggerConfetti();

                if (streak >= 2) {
                    setTimeout(() => { bonusOffer.style.display = 'flex'; }, 800);
                }
            } else {
                balance -= bet;
                streak = 0;
                slotMessage.textContent = `Lost -₹${bet.toFixed(2)}`;
                slotMessage.className = "slot-message text-lose";
                slotDisplay.style.borderColor = "var(--lose)";
            }

            gameHistory.push(isWin);
            updateStats();
            updateHistoryUI();
            playBtn.disabled = false;
        }

        function updateStats() {
            balanceEl.textContent = balance.toFixed(2);
            streakEl.textContent = streak;
        }

        function updateHistoryUI() {
            historyEl.innerHTML = '';
            gameHistory.slice(-8).forEach(win => {
                const dot = document.createElement('div');
                dot.className = `history-dot ${win ? 'win' : 'lose'}`;
                historyEl.appendChild(dot);
            });
        }

        function shakeElement(el) {
            el.classList.add('shake');
            setTimeout(() => el.classList.remove('shake'), 400);
        }

        // Bonus Offer Logic
        doubleBtn.onclick = () => {
            const current = parseFloat(betInput.value) || 0;
            betInput.value = current * 2;
            bonusOffer.style.display = 'none';
        };

        continueBtn.onclick = () => {
            bonusOffer.style.display = 'none';
        };

        // Canvas Confetti
        const canvas = document.getElementById('confetti-canvas')
